description: >-
  Level2 is a no-code systematic-trading platform from Bytemine Technologies Ltd that lets active retail traders
  build, backtest and deploy fully automated strategies from a visual drag-and-drop canvas, with no code and no
  proprietary scripting language. Strategies can be rehearsed against historical data or paper-traded with virtual
  funds before being deployed live through a connected brokerage account. Level2 also sells the platform to brokers
  and prop firms as an embeddable surface: a customised iframe of the strategy builder, four standalone market widgets,
  and the Level2 Hub Broker API, which lets a broker register and manage its own customers' Level2 accounts, read
  their strategies, deployments, trades and backtests, and measure their execution latency and slippage.
