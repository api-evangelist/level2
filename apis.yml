  name: Level2 Hub API
  description: >-
    The live Level2 platform API — a single FastAPI service carrying 301 operations across the end-user surface
    (visual strategy canvas, backtesting, live and virtual deployment, market scanners, the strategy marketplace,
    prediction-market analytics) and the /broker/* partner surface brokers integrate against to register and manage
    their own customers' Level2 accounts, read strategies, deployments, trades and backtests, and measure execution
    latency and slippage. Broker partners authenticate with an HS256 JWT they mint themselves, capped at 180 minutes.
