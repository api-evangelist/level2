description: >-
  Level2's embeddable client-side surface. This is a substantial part of what the company actually
  sells to brokers — the visual strategy builder and the analytics widgets are delivered as hosted
  iframes rendered inside the partner's own platform, not as an npm component library. Every embed
  URL below is quoted verbatim from the provider's own published integration snippet.
distribution: hosted-iframe
loader_libraries: []
loader_note: >-
  There is no JavaScript loader, web-component package or element library. Integration is a plain
  <iframe> tag; the provider's own snippets set width="100%", height="600px" and a border-radius.
families:
  - family: Market widgets
    url: https://www.trylevel2.com/widgets
    description: >-
      Four named, individually embeddable analytics widgets, each with a live preview and a
      copy-to-clipboard integration snippet on the widgets page. A `theme` query parameter is the one
      documented configuration option, and the page states that the embedding origin is detected.
    configuration:
      theme:
        values: [dark]
        note: The published snippets pin theme=dark; no other value is documented.
      origin:
        value: detected
    components:
