        snippet: '<iframe src="https://app.trylevel2.com/embed/pairs?theme=dark" width="100%" height="600px" title="Pairs Trading"></iframe>'
        description: Directional strategies using one asset to predict another.
      - name: Strategy Lab Reviews
        embed: https://app.trylevel2.com/embed/strategy-lab
        snippet: '<iframe src="https://app.trylevel2.com/embed/strategy-lab?theme=dark" width="100%" height="600px" title="Strategy Lab Reviews"></iframe>'
