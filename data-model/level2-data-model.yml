notes:
- 'The graph is centred on three nouns: a USER owns STRATEGIES, a strategy becomes a live DEPLOYMENT,
  and a deployment produces an ORDER BOOK. Everything else — scanners, the marketplace, explore/showcase,
  notifications — hangs off that spine.'
- The Canvas* family (indicators, logics, actions, patterns, chart patterns, data sources, each with its
  own inputs/params/outputs children) is the machine-readable vocabulary of the visual strategy builder
  itself, and is the most structurally detailed part of the contract.
- No subway/ render exists for this repo.
