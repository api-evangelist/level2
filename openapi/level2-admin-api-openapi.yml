components:
  schemas:
    PaginatedResponse:
      title: PaginatedResponse
      required:
      - items
      - total
      - page
      - size
      - pages
      type: object
      properties:
        items:
          title: Items
          type: array
          items: {}
        total:
          title: Total
          type: integer
        page:
          title: Page
          type: integer
        size:
          title: Size
          type: integer
        pages:
          title: Pages
          type: integer
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    AdminStrategiesResponse:
      title: AdminStrategiesResponse
      required:
      - success
      - strategies
      type: object
      properties:
        success:
          title: Success
          type: boolean
        strategies:
          $ref: '#/components/schemas/PaginatedResponse'
