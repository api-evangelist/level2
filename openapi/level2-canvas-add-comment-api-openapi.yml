openapi: 3.2.0
info:
  title: Level2 Hub Controller Canvas Add Comment API
  version: 0.1.0
tags:
- name: Canvas Add Comment
paths:
  /canvas_add_comment:
    post:
      summary: Canvas Add Comment
      operationId: canvas_add_comment_canvas_add_comment_post
      parameters:
      - required: true
        schema:
          title: Strategy Key
          type: string
        name: strategy_key
        in: query
      - required: false
        schema:
          title: User Id
          type: string
        name: user_id
        in: query
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_canvas_add_comment_canvas_add_comment_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Canvas Add Comment
components:
  schemas:
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    Body_canvas_add_comment_canvas_add_comment_post:
      title: Body_canvas_add_comment_canvas_add_comment_post
      type: object
      properties:
        comment:
          title: Comment
          type: string
        reaction:
          title: Reaction
          type: string
