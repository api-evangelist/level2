openapi: 3.2.0
info:
  title: Level2 Hub Controller Change Tp Sl Percent API
  version: 0.1.0
tags:
- name: Change Tp Sl Percent
paths:
  /change_tp_sl_percent:
    post:
      summary: Change Tp Sl Percent
      operationId: change_tp_sl_percent_change_tp_sl_percent_post
      parameters:
      - required: true
        schema:
          title: User Id
          type: string
        name: user_id
        in: query
      - required: true
        schema:
          title: Tp Is Percent
          type: boolean
        name: tp_is_percent
        in: query
      - required: true
        schema:
          title: Sl Is Percent
          type: boolean
        name: sl_is_percent
        in: query
      - required: true
        schema:
          title: Strategy Id
          type: integer
        name: strategy_id
        in: query
      - required: true
        schema:
          title: Tp
          type: number
        name: tp
        in: query
      - required: true
        schema:
          title: Sl
          type: number
        name: sl
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Change Tp Sl Percent Change Tp Sl Percent Post
                type: array
                items:
                  $ref: '#/components/schemas/ActionMetricsOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Change Tp Sl Percent
components:
  schemas:
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ActionMetricsOut:
      title: ActionMetricsOut
      type: object
      properties:
        trailling_sl_p:
          title: Trailling Sl P
          type: string
        trailling_sl:
          title: Trailling Sl
          type: string
        order_type:
          title: Order Type
          type: string
        node_id:
          title: Node Id
          type: string
        stop_loss_p:
          title: Stop Loss P
          type: string
        stop_loss:
          title: Stop Loss
          type: string
        size:
          title: Size
          type: string
        take_profit:
          title: Take Profit
          type: string
        take_profit_pips:
          title: Take Profit Pips
          type: string
        stop_loss_pips:
          title: Stop Loss Pips
          type: string
        take_profit_price:
          title: Take Profit Price
          type: string
        stop_loss_price:
          title: Stop Loss Price
          type: string
        take_profit_p:
          title: Take Profit P
          type: string
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
