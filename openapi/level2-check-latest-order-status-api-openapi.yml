openapi: 3.2.0
info:
  title: Level2 Hub Controller Check Latest Order Status API
  version: 0.1.0
tags:
- name: Check Latest Order Status
paths:
  /check_latest_order_status:
    get:
      summary: Check Latest Order Status
      operationId: check_latest_order_status_check_latest_order_status_get
      parameters:
      - required: true
        schema:
          title: User Id
          type: string
        name: user_id
        in: query
      - required: true
        schema:
          title: Strategy Id
          type: integer
        name: strategy_id
        in: query
      - required: true
        schema:
          title: Depl Id
          type: integer
        name: depl_id
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Check Latest Order Status
components:
  schemas:
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
