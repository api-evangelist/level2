        schema:
          title: Token
          type: string
        name: token
        in: query
      - required: false
        schema:
          title: Account
          type: string
        name: account
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
