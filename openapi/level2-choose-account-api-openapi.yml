      operationId: connecttrade_select_account_choose_account_connecttrade_post
      parameters:
      - required: false
        schema:
          title: User Id
          type: string
        name: user_id
        in: query
      - required: false
        schema:
          title: Broker Id
          type: integer
        name: broker_id
        in: query
      - required: false
        schema:
          title: Account Id
          type: string
        name: account_id
        in: query
      - required: false
        schema:
          title: Connection Id
          type: string
        name: connection_id
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
