openapi: 3.2.0
info:
  title: Level2 Hub Controller Deploy Notification Strategy API
  version: 0.1.0
tags:
- name: Deploy Notification Strategy
paths:
  /deploy_notification_strategy:
    post:
      summary: Deploy Notification Strategy
      operationId: deploy_notification_strategy_deploy_notification_strategy_post
      parameters:
      - required: true
        schema:
          title: Keygen
          type: string
        name: keygen
        in: query
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_deploy_notification_strategy_deploy_notification_strategy_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDeploymentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Deploy Notification Strategy
components:
  schemas:
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    StrategyOut:
      title: StrategyOut
      required:
      - id
      - keygen
      - backtest_type
      type: object
      properties:
        id:
          title: Id
          type: integer
        keygen:
          title: Keygen
          type: string
        strategy_name:
          title: Strategy Name
          type: string
        symbol:
          title: Symbol
          type: string
        is_deleted:
          title: Is Deleted
          type: integer
          default: 0
        timeframe:
          title: Timeframe
          type: string
        strategy_category:
          $ref: '#/components/schemas/StrategyCategoryOut'
        add_ons:
          title: Add Ons
          type: string
        broker_id:
          title: Broker Id
          type: integer
        is_copied:
          title: Is Copied
          type: integer
          default: 0
        is_notification:
          title: Is Notification
          type: integer
          default: 0
        backtest_type:
          title: Backtest Type
          type: string
        strategy_data:
          title: Strategy Data
          type: string
        canvas_data:
          title: Canvas Data
          type: string
        strategy_description:
          title: Strategy Description
          type: string
        created_at:
          title: Created At
          type: string
          format: date-time
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    UserOut:
      title: UserOut
      required:
      - email
      - first_name
      - last_name
      - unique_key
      - is_active
      type: object
      properties:
        email:
          title: Email
          type: string
        first_name:
          title: First Name
          type: string
        last_name:
          title: Last Name
          type: string
        unique_key:
          title: Unique Key
          type: string
        profile_image:
          title: Profile Image
          type: string
        trading_challenge:
          title: Trading Challenge
          type: string
        description:
          title: Description
          type: string
        is_active:
          title: Is Active
          type: boolean
        user_type:
          title: User Type
          type: string
        meta_data:
          title: Meta Data
          type: string
        created_at:
          title: Created At
          type: string
          format: date-time
    NotificationDeploymentOut:
      title: NotificationDeploymentOut
      required:
      - id
      type: object
      properties:
        id:
          title: Id
          type: integer
        user:
          $ref: '#/components/schemas/UserOut'
        strategy:
          $ref: '#/components/schemas/StrategyOut'
        created_at:
          title: Created At
          type: string
          format: date-time
    StrategyCategoryOut:
      title: StrategyCategoryOut
      required:
      - id
      - label
      - description
      - is_valid
      type: object
      properties:
        id:
          title: Id
          type: integer
        label:
          title: Label
          type: string
        description:
          title: Description
          type: string
        is_valid:
          title: Is Valid
          type: string
    Body_deploy_notification_strategy_deploy_notification_strategy_post:
      title: Body_deploy_notification_strategy_deploy_notification_strategy_post
      required:
      - strategy_data
      - canvas_data
      type: object
      properties:
        strategy_data:
          title: Strategy Data
          type: string
        canvas_data:
          title: Canvas Data
          type: string
