openapi: 3.2.0
info:
  title: Level2 Hub Controller Deploy Scanner API
  version: 0.1.0
tags:
- name: Deploy Scanner
paths:
  /deploy_scanner:
    post:
      summary: Deploy Scanner
      operationId: deploy_scanner_deploy_scanner_post
      parameters:
      - required: true
        schema:
          title: Keygen
          type: string
        name: keygen
        in: query
      - required: true
        schema:
          title: Universe Id
          type: string
        name: universe_id
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Deploy Scanner
components:
  schemas:
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
