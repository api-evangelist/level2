openapi: 3.2.0
info:
  title: Level2 External Analysis API
  version: 0.1.0
  description: 'Operations tagged External Analysis across 2 of this provider''s published API definitions: level2-hub-controller-openapi.json, level2-hub-controller-openapi.json. Each path carries the servers of the definition it was published in.'
tags:
- name: External Analysis
paths:
  /api/external_analysis:
    post:
      summary: Track Event
      description: Forward analytics events to GA4 Measurement Protocol.
      operationId: track_event_api_external_analysis_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsEvent'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - External Analysis
components:
  schemas:
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    AnalyticsEvent:
      title: AnalyticsEvent
      required:
      - event_name
      type: object
      properties:
        event_name:
          title: Event Name
          type: string
        params:
          title: Params
          type: object
          default: {}
        client_id:
          title: Client Id
          type: string
        user_id:
          title: User Id
          type: string
        page_path:
          title: Page Path
          type: string
        location:
          title: Location
          type: string
x-refined-from:
- level2-hub-controller-openapi.json
- level2-hub-controller-openapi.json
