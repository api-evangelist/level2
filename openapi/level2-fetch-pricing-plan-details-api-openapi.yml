openapi: 3.2.0
info:
  title: Level2 Hub Controller Fetch Pricing Plan Details API
  version: 0.1.0
tags:
- name: Fetch Pricing Plan Details
paths:
  /fetch_pricing_plan_details:
    post:
      summary: Fetch Pricing Plan Details
      operationId: fetch_pricing_plan_details_fetch_pricing_plan_details_post
      parameters:
      - required: true
        schema:
          title: User Id
          type: string
        name: user_id
        in: query
      - required: true
        schema:
          title: Coupon
          type: string
        name: coupon
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Fetch Pricing Plan Details
components:
  schemas:
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
