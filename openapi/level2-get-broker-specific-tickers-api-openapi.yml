openapi: 3.2.0
info:
  title: Level2 Hub Controller Get Broker Specific Tickers API
  version: 0.1.0
tags:
- name: Get Broker Specific Tickers
paths:
  /get_broker_specific_tickers:
    get:
      summary: Get Broker Specific Tickers
      operationId: get_broker_specific_tickers_get_broker_specific_tickers_get
      parameters:
      - required: true
        schema:
          title: User Id
          type: string
        name: user_id
        in: query
      - required: true
        schema:
          title: Broker
          type: string
        name: broker
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Get Broker Specific Tickers Get Broker Specific Tickers Get
                type: array
                items:
                  $ref: '#/components/schemas/BrokerTickersOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Get Broker Specific Tickers
components:
  schemas:
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    BrokerTickersOut:
      title: BrokerTickersOut
      required:
      - name
      - symbol
      - short_name
      type: object
      properties:
        name:
          title: Name
          type: string
        symbol:
          title: Symbol
          type: string
        short_name:
          title: Short Name
          type: string
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
