openapi: 3.2.0
info:
  title: Level2 Hub Controller Get Fennel Accounts API
  version: 0.1.0
tags:
- name: Get Fennel Accounts
paths:
  /get_fennel_accounts:
    get:
      summary: Get Fennel Accounts
      operationId: get_fennel_accounts_get_fennel_accounts_get
      parameters:
      - required: true
        schema:
          title: Access Token
          type: string
        name: access_token
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Get Fennel Accounts
components:
  schemas:
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
