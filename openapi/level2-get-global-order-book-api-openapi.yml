openapi: 3.2.0
info:
  title: Level2 Hub Controller Get Global Order Book API
  version: 0.1.0
tags:
- name: Get Global Order Book
paths:
  /get_global_order_book:
    get:
      summary: Get Global Order Book
      operationId: get_global_order_book_get_global_order_book_get
      parameters:
      - required: true
        schema:
          title: User Id
          type: string
        name: user_id
        in: query
      - required: true
        schema:
          title: Mode
          type: string
        name: mode
        in: query
      - required: false
        schema:
          title: Page
          minimum: 1.0
          type: integer
          default: 1
        name: page
        in: query
      - required: false
        schema:
          title: Size
          maximum: 100.0
          minimum: 1.0
          type: integer
          default: 50
        name: size
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Union_VirtualDeploymentOrderBookOut__LiveDeploymentOrderBookOut__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Get Global Order Book
components:
  schemas:
    StrategyDataLimitedOut:
      title: StrategyDataLimitedOut
      required:
      - strategy_name
      - timeframe
      - symbol
      - id
      - keygen
      type: object
      properties:
        strategy_name:
          title: Strategy Name
          type: string
        timeframe:
          title: Timeframe
          type: string
        symbol:
          title: Symbol
          type: string
        id:
          title: Id
          type: integer
        keygen:
          title: Keygen
          type: string
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    LiveDeploymentOrderBookOut:
      title: LiveDeploymentOrderBookOut
      required:
      - id
      - deployment_id
      type: object
      properties:
        id:
          title: Id
          type: integer
        strategy:
          $ref: '#/components/schemas/StrategyDataLimitedOut'
        deployment_id:
          title: Deployment Id
          type: integer
        stoploss:
          title: Stoploss
          type: string
        target:
          title: Target
          type: string
        decision:
          title: Decision
          type: string
        order_price:
          title: Order Price
          type: string
        filled_at_price:
          title: Filled At Price
          type: number
        result:
          title: Result
          type: number
        actual_result:
          title: Actual Result
          type: number
        quantity:
          title: Quantity
          type: number
        misc_data:
          title: Misc Data
          type: string
        trade_taken_at:
          title: Trade Taken At
          type: string
        trade_closed_at:
          title: Trade Closed At
          type: string
        order_status:
          title: Order Status
          type: string
        close_value:
          title: Close Value
          type: string
        is_valid:
          title: Is Valid
          type: integer
        created_at:
          title: Created At
          type: string
          format: date-time
        symbol:
          title: Symbol
          type: string
        meta_data:
          title: Meta Data
          type: string
    VirtualDeploymentOrderBookOut:
      title: VirtualDeploymentOrderBookOut
      required:
      - deployment_id
      - strategy
      type: object
      properties:
        deployment_id:
          title: Deployment Id
          type: integer
        strategy:
          $ref: '#/components/schemas/StrategyDataLimitedOut'
        stoploss:
          title: Stoploss
          type: string
        target:
          title: Target
          type: string
        decision:
          title: Decision
          type: string
        order_price:
          title: Order Price
          type: string
        result:
          title: Result
          type: number
        trade_taken_at:
          title: Trade Taken At
          type: string
        trade_closed_at:
          title: Trade Closed At
          type: string
        order_status:
          title: Order Status
          type: string
        close_value:
          title: Close Value
          type: string
        is_valid:
          title: Is Valid
          type: integer
        created_at:
          title: Created At
          type: string
          format: date-time
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    Page_Union_VirtualDeploymentOrderBookOut__LiveDeploymentOrderBookOut__:
      title: Page[Union[VirtualDeploymentOrderBookOut, LiveDeploymentOrderBookOut]]
      required:
      - items
      - total
      type: object
      properties:
        items:
          title: Items
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/VirtualDeploymentOrderBookOut'
            - $ref: '#/components/schemas/LiveDeploymentOrderBookOut'
        total:
          title: Total
          minimum: 0.0
          type: integer
        page:
          title: Page
          minimum: 1.0
          type: integer
        size:
          title: Size
          minimum: 1.0
          type: integer
        pages:
          title: Pages
          minimum: 0.0
          type: integer
