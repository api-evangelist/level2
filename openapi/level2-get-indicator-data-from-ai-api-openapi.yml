openapi: 3.2.0
info:
  title: Level2 Hub Controller Get Indicator Data From Ai API
  version: 0.1.0
tags:
- name: Get Indicator Data From Ai
paths:
  /get_indicator_data_from_ai:
    get:
      summary: Get Indicator Data From Ai
      operationId: get_indicator_data_from_ai_get_indicator_data_from_ai_get
      parameters:
      - required: true
        schema:
          title: User Id
          type: string
        name: user_id
        in: query
      - required: true
        schema:
          title: Indicator
          type: string
        name: indicator
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Get Indicator Data From Ai
components:
  schemas:
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
