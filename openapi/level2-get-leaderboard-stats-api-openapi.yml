openapi: 3.2.0
info:
  title: Level2 Hub Controller Get Leaderboard Stats API
  version: 0.1.0
tags:
- name: Get Leaderboard Stats
paths:
  /get_leaderboard_stats:
    get:
      summary: Get Leaderboard Stats
      operationId: get_leaderboard_stats_get_leaderboard_stats_get
      parameters:
      - required: true
        schema:
          title: Challenge
          type: string
        name: challenge
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Get Leaderboard Stats
components:
  schemas:
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    LeaderboardOut:
      title: LeaderboardOut
      required:
      - data
      - trading_challenge
      - last_updated_at
      type: object
      properties:
        data:
          title: Data
          type: string
        trading_challenge:
          title: Trading Challenge
          type: string
        last_updated_at:
          title: Last Updated At
          type: string
          format: date-time
