openapi: 3.2.0
info:
  title: Level2 Hub Controller Get Live Expired Strategies V2 API
  version: 0.1.0
tags:
- name: Get Live Expired Strategies V2
paths:
  /get_live_expired_strategies_v2:
    get:
      summary: Get Live Expired Strategies V2
      operationId: get_live_expired_strategies_v2_get_live_expired_strategies_v2_get
      parameters:
      - required: true
        schema:
          title: User Id
          type: string
        name: user_id
        in: query
      - required: false
        schema:
          title: Search Key
          type: string
        name: search_key
        in: query
      - required: false
        schema:
          title: Prediction Market
          type: boolean
          default: false
        name: prediction_market
        in: query
      - description: Page number
        required: false
        schema:
          title: Page
          minimum: 1.0
          type: integer
          description: Page number
          default: 1
        name: page
        in: query
      - description: Items per page
        required: false
        schema:
          title: Size
          maximum: 100.0
          minimum: 1.0
          type: integer
          description: Items per page
          default: 10
        name: size
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveExpiredOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Get Live Expired Strategies V2
components:
  schemas:
    LiveDeploymentCustomOut:
      title: LiveDeploymentCustomOut
      required:
      - deployment_meta
      type: object
      properties:
        deployment_meta:
          $ref: '#/components/schemas/LiveDeploymentOut'
        epoch_created_at:
          title: Epoch Created At
          type: string
        epoch_expired_at:
          title: Epoch Expired At
          type: string
    StrategyOut:
      title: StrategyOut
      required:
      - id
      - keygen
      - backtest_type
      type: object
      properties:
        id:
          title: Id
          type: integer
        keygen:
          title: Keygen
          type: string
        strategy_name:
          title: Strategy Name
          type: string
        symbol:
          title: Symbol
          type: string
        is_deleted:
          title: Is Deleted
          type: integer
          default: 0
        timeframe:
          title: Timeframe
          type: string
        strategy_category:
          $ref: '#/components/schemas/StrategyCategoryOut'
        add_ons:
          title: Add Ons
          type: string
        broker_id:
          title: Broker Id
          type: integer
        is_copied:
          title: Is Copied
          type: integer
          default: 0
        is_notification:
          title: Is Notification
          type: integer
          default: 0
        backtest_type:
          title: Backtest Type
          type: string
        strategy_data:
          title: Strategy Data
          type: string
        canvas_data:
          title: Canvas Data
          type: string
        strategy_description:
          title: Strategy Description
          type: string
        created_at:
          title: Created At
          type: string
          format: date-time
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    B2cBrokersOut:
      title: B2cBrokersOut
      type: object
      properties:
        id:
          title: Id
          type: integer
        broker_name:
          title: Broker Name
          type: string
        image_url:
          title: Image Url
          type: string
        doc_url:
          title: Doc Url
          type: string
        referral_link:
          title: Referral Link
          type: string
        offer_valid:
          title: Offer Valid
          type: integer
    LiveExpiredOut:
      title: LiveExpiredOut
      required:
      - total
      - page
      - size
      - pages
      type: object
      properties:
        data:
          title: Data
          type: array
          items:
            $ref: '#/components/schemas/LiveDeploymentCustomOut'
        total:
          title: Total
          type: integer
        page:
          title: Page
          type: integer
        size:
          title: Size
          type: integer
        pages:
          title: Pages
          type: integer
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    LiveDeploymentOut:
      title: LiveDeploymentOut
      required:
      - created_at
      - last_updated_at
      - broker
      - strategy
      type: object
      properties:
        id:
          title: Id
          type: integer
        meta_data:
          title: Meta Data
          type: string
        dep_flag:
          title: Dep Flag
          type: string
        is_valid:
          title: Is Valid
          type: string
        deployed_symbols:
          title: Deployed Symbols
          type: string
        order_trade_type:
          title: Order Trade Type
          type: string
        created_at:
          title: Created At
          type: string
          format: date-time
        last_updated_at:
          title: Last Updated At
          type: string
          format: date-time
        broker:
          $ref: '#/components/schemas/B2cBrokersOut'
        strategy:
          $ref: '#/components/schemas/StrategyOut'
    StrategyCategoryOut:
      title: StrategyCategoryOut
      required:
      - id
      - label
      - description
      - is_valid
      type: object
      properties:
        id:
          title: Id
          type: integer
        label:
          title: Label
          type: string
        description:
          title: Description
          type: string
        is_valid:
          title: Is Valid
          type: string
