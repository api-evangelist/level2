openapi: 3.2.0
info:
  title: Level2 Hub Controller Get Open Live Order API
  version: 0.1.0
tags:
- name: Get Open Live Order
paths:
  /get_open_live_order:
    get:
      summary: Get Open Live Order
      operationId: get_open_live_order_get_open_live_order_get
      parameters:
      - required: true
        schema:
          title: Deployment Id
          type: integer
        name: deployment_id
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenOrderLiveDeploymentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Get Open Live Order
components:
  schemas:
    StrategyOut:
      title: StrategyOut
      required:
      - id
      - keygen
      - backtest_type
      type: object
      properties:
        id:
          title: Id
          type: integer
        keygen:
          title: Keygen
          type: string
        strategy_name:
          title: Strategy Name
          type: string
        symbol:
          title: Symbol
          type: string
        is_deleted:
          title: Is Deleted
          type: integer
          default: 0
        timeframe:
          title: Timeframe
          type: string
        strategy_category:
          $ref: '#/components/schemas/StrategyCategoryOut'
        add_ons:
          title: Add Ons
          type: string
        broker_id:
          title: Broker Id
          type: integer
        is_copied:
          title: Is Copied
          type: integer
          default: 0
        is_notification:
          title: Is Notification
          type: integer
          default: 0
        backtest_type:
          title: Backtest Type
          type: string
        strategy_data:
          title: Strategy Data
          type: string
        canvas_data:
          title: Canvas Data
          type: string
        strategy_description:
          title: Strategy Description
          type: string
        created_at:
          title: Created At
          type: string
          format: date-time
    OpenOrderLiveDeploymentOut:
      title: OpenOrderLiveDeploymentOut
      type: object
      properties:
        order_book_data:
          $ref: '#/components/schemas/LiveOrderBookOut'
        deployment_id:
          title: Deployment Id
          type: integer
        strategy_key:
          title: Strategy Key
          type: string
        strategy_name:
          title: Strategy Name
          type: string
        strategy_data:
          title: Strategy Data
          type: string
        timeframe:
          title: Timeframe
          type: string
        symbol:
          title: Symbol
          type: string
        deployment:
          $ref: '#/components/schemas/LiveDeploymentOut'
        last_order_data:
          $ref: '#/components/schemas/LastOrderLiveDeploymentOut'
    LiveOrderBookOut:
      title: LiveOrderBookOut
      required:
      - id
      type: object
      properties:
        id:
          title: Id
          type: integer
        stoploss:
          title: Stoploss
          type: string
        target:
          title: Target
          type: string
        decision:
          title: Decision
          type: string
        order_price:
          title: Order Price
          type: string
        result:
          title: Result
          type: string
        trade_taken_at:
          title: Trade Taken At
          type: string
        trade_closed_at:
          title: Trade Closed At
          type: string
        meta_data:
          title: Meta Data
          type: string
        order_status:
          title: Order Status
          type: string
        close_value:
          title: Close Value
          type: string
        quantity:
          title: Quantity
          type: string
        original_quantity:
          title: Original Quantity
          type: string
        misc_data:
          title: Misc Data
          type: string
        trade_closed_at_ts:
          title: Trade Closed At Ts
          type: string
          format: date-time
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    B2cBrokersOut:
      title: B2cBrokersOut
      type: object
      properties:
        id:
          title: Id
          type: integer
        broker_name:
          title: Broker Name
          type: string
        image_url:
          title: Image Url
          type: string
        doc_url:
          title: Doc Url
          type: string
        referral_link:
          title: Referral Link
          type: string
        offer_valid:
          title: Offer Valid
          type: integer
    LastOrderLiveDeploymentOut:
      title: LastOrderLiveDeploymentOut
      type: object
      properties:
        order_book_data:
          $ref: '#/components/schemas/LiveOrderBookOut'
        deployment_id:
          title: Deployment Id
          type: integer
        strategy_key:
          title: Strategy Key
          type: string
        strategy_name:
          title: Strategy Name
          type: string
        strategy_data:
          title: Strategy Data
          type: string
        timeframe:
          title: Timeframe
          type: string
        symbol:
          title: Symbol
          type: string
        deployment_meta:
          $ref: '#/components/schemas/LiveDeploymentOut'
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    LiveDeploymentOut:
      title: LiveDeploymentOut
      required:
      - created_at
      - last_updated_at
      - broker
      - strategy
      type: object
      properties:
        id:
          title: Id
          type: integer
        meta_data:
          title: Meta Data
          type: string
        dep_flag:
          title: Dep Flag
          type: string
        is_valid:
          title: Is Valid
          type: string
        deployed_symbols:
          title: Deployed Symbols
          type: string
        order_trade_type:
          title: Order Trade Type
          type: string
        created_at:
          title: Created At
          type: string
          format: date-time
        last_updated_at:
          title: Last Updated At
          type: string
          format: date-time
        broker:
          $ref: '#/components/schemas/B2cBrokersOut'
        strategy:
          $ref: '#/components/schemas/StrategyOut'
    StrategyCategoryOut:
      title: StrategyCategoryOut
      required:
      - id
      - label
      - description
      - is_valid
      type: object
      properties:
        id:
          title: Id
          type: integer
        label:
          title: Label
          type: string
        description:
          title: Description
          type: string
        is_valid:
          title: Is Valid
          type: string
