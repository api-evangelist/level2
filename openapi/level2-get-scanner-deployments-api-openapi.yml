openapi: 3.2.0
info:
  title: Level2 Hub Controller Get Scanner Deployments API
  version: 0.1.0
tags:
- name: Get Scanner Deployments
paths:
  /get_scanner_deployments:
    post:
      summary: Get Scanner Deployments
      operationId: get_scanner_deployments_get_scanner_deployments_post
      parameters:
      - required: true
        schema:
          title: User Id
          type: string
        name: user_id
        in: query
      - required: false
        schema:
          title: Page
          minimum: 1.0
          type: integer
          default: 1
        name: page
        in: query
      - required: false
        schema:
          title: Size
          maximum: 100.0
          minimum: 1.0
          type: integer
          default: 50
        name: size
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ScannerDeploymentsOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Get Scanner Deployments
components:
  schemas:
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    Page_ScannerDeploymentsOut_:
      title: Page[ScannerDeploymentsOut]
      required:
      - items
      - total
      type: object
      properties:
        items:
          title: Items
          type: array
          items:
            $ref: '#/components/schemas/ScannerDeploymentsOut'
        total:
          title: Total
          minimum: 0.0
          type: integer
        page:
          title: Page
          minimum: 1.0
          type: integer
        size:
          title: Size
          minimum: 1.0
          type: integer
        pages:
          title: Pages
          minimum: 0.0
          type: integer
    ScannerDeploymentsOut:
      title: ScannerDeploymentsOut
      required:
      - created_at
      - last_updated_at
      type: object
      properties:
        id:
          title: Id
          type: integer
        universe:
          $ref: '#/components/schemas/MarketScannerUniverseOut'
        strategy:
          $ref: '#/components/schemas/StrategyOut'
        created_at:
          title: Created At
          type: string
          format: date-time
        last_updated_at:
          title: Last Updated At
          type: string
          format: date-time
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    StrategyOut:
      title: StrategyOut
      required:
      - id
      - keygen
      - backtest_type
      type: object
      properties:
        id:
          title: Id
          type: integer
        keygen:
          title: Keygen
          type: string
        strategy_name:
          title: Strategy Name
          type: string
        symbol:
          title: Symbol
          type: string
        is_deleted:
          title: Is Deleted
          type: integer
          default: 0
        timeframe:
          title: Timeframe
          type: string
        strategy_category:
          $ref: '#/components/schemas/StrategyCategoryOut'
        add_ons:
          title: Add Ons
          type: string
        broker_id:
          title: Broker Id
          type: integer
        is_copied:
          title: Is Copied
          type: integer
          default: 0
        is_notification:
          title: Is Notification
          type: integer
          default: 0
        backtest_type:
          title: Backtest Type
          type: string
        strategy_data:
          title: Strategy Data
          type: string
        canvas_data:
          title: Canvas Data
          type: string
        strategy_description:
          title: Strategy Description
          type: string
        created_at:
          title: Created At
          type: string
          format: date-time
    StrategyCategoryOut:
      title: StrategyCategoryOut
      required:
      - id
      - label
      - description
      - is_valid
      type: object
      properties:
        id:
          title: Id
          type: integer
        label:
          title: Label
          type: string
        description:
          title: Description
          type: string
        is_valid:
          title: Is Valid
          type: string
    MarketScannerUniverseOut:
      title: MarketScannerUniverseOut
      type: object
      properties:
        meta:
          title: Meta
          type: object
        keygen:
          title: Keygen
          type: string
        universe_list:
          title: Universe List
          type: array
          items: {}
