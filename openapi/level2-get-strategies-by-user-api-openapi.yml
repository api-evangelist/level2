openapi: 3.2.0
info:
  title: Level2 Hub Controller Get Strategies By User API
  version: 0.1.0
tags:
- name: Get Strategies By User
paths:
  /get_strategies_by_user:
    get:
      summary: Get Strategies
      operationId: get_strategies_get_strategies_by_user_get
      parameters:
      - required: true
        schema:
          title: User Id
          type: string
        name: user_id
        in: query
      - required: false
        schema:
          title: Is Copied
          type: integer
          default: 0
        name: is_copied
        in: query
      - required: false
        schema:
          title: Search Key
          type: string
        name: search_key
        in: query
      - required: false
        schema:
          title: Broker Id
          type: integer
        name: broker_id
        in: query
      - description: Page number
        required: false
        schema:
          title: Page
          minimum: 1.0
          type: integer
          description: Page number
          default: 1
        name: page
        in: query
      - description: Items per page
        required: false
        schema:
          title: Size
          maximum: 100.0
          minimum: 1.0
          type: integer
          description: Items per page
          default: 10
        name: size
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStrategiesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Get Strategies By User
components:
  schemas:
    StrategyOut:
      title: StrategyOut
      required:
      - id
      - keygen
      - backtest_type
      type: object
      properties:
        id:
          title: Id
          type: integer
        keygen:
          title: Keygen
          type: string
        strategy_name:
          title: Strategy Name
          type: string
        symbol:
          title: Symbol
          type: string
        is_deleted:
          title: Is Deleted
          type: integer
          default: 0
        timeframe:
          title: Timeframe
          type: string
        strategy_category:
          $ref: '#/components/schemas/StrategyCategoryOut'
        add_ons:
          title: Add Ons
          type: string
        broker_id:
          title: Broker Id
          type: integer
        is_copied:
          title: Is Copied
          type: integer
          default: 0
        is_notification:
          title: Is Notification
          type: integer
          default: 0
        backtest_type:
          title: Backtest Type
          type: string
        strategy_data:
          title: Strategy Data
          type: string
        canvas_data:
          title: Canvas Data
          type: string
        strategy_description:
          title: Strategy Description
          type: string
        created_at:
          title: Created At
          type: string
          format: date-time
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    PaginatedStrategiesResponse:
      title: PaginatedStrategiesResponse
      required:
      - items
      - total
      - page
      - size
      - pages
      type: object
      properties:
        items:
          title: Items
          type: array
          items:
            $ref: '#/components/schemas/StrategiesCustomOut'
        total:
          title: Total
          type: integer
        page:
          title: Page
          type: integer
        size:
          title: Size
          type: integer
        pages:
          title: Pages
          type: integer
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    StrategiesCustomOut:
      title: StrategiesCustomOut
      required:
      - strategy
      - block_data
      type: object
      properties:
        strategy:
          $ref: '#/components/schemas/StrategyOut'
        block_data:
          title: Block Data
          type: object
        epoch_created_at:
          title: Epoch Created At
          type: string
        is_deployed_live:
          title: Is Deployed Live
          type: boolean
          default: false
        is_published:
          title: Is Published
          type: integer
          default: 0
        backtest_data:
          title: Backtest Data
          type: string
        strategy_description:
          title: Strategy Description
          type: string
        depl_id:
          title: Depl Id
          type: integer
        realised_pnl:
          title: Realised Pnl
          type: number
          default: 0.0
        total_quantity_traded:
          title: Total Quantity Traded
          type: number
          default: 0.0
    StrategyCategoryOut:
      title: StrategyCategoryOut
      required:
      - id
      - label
      - description
      - is_valid
      type: object
      properties:
        id:
          title: Id
          type: integer
        label:
          title: Label
          type: string
        description:
          title: Description
          type: string
        is_valid:
          title: Is Valid
          type: string
