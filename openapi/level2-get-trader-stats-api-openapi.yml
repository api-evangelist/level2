openapi: 3.2.0
info:
  title: Level2 Hub Controller Get Trader Stats API
  version: 0.1.0
tags:
- name: Get Trader Stats
paths:
  /get_trader_stats:
    get:
      summary: Get Trader Stats
      operationId: get_trader_stats_get_trader_stats_get
      parameters:
      - required: true
        schema:
          title: User Keygen
          type: string
        name: user_keygen
        in: query
      - required: false
        schema:
          title: User Id
        name: user_id
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Get Trader Stats
components:
  schemas:
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
