openapi: 3.2.0
info:
  title: Level2 Hub Controller Get Trending Traders API
  version: 0.1.0
tags:
- name: Get Trending Traders
paths:
  /get_trending_traders:
    get:
      summary: Get Trending Traders
      operationId: get_trending_traders_get_trending_traders_get
      parameters:
      - required: true
        schema:
          title: Order Key
          type: string
        name: order_key
        in: query
      - required: false
        schema:
          title: Order Rule
          type: string
        name: order_rule
        in: query
      - required: false
        schema:
          title: Offset
          type: string
          default: 0
        name: offset
        in: query
      - required: false
        schema:
          title: Asset Class
          type: string
        name: asset_class
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Get Trending Traders
components:
  schemas:
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
