openapi: 3.2.0
info:
  title: Level2 Hub Controller Join Us Form Main Web API
  version: 0.1.0
tags:
- name: Join Us Form Main Web
paths:
  /join_us_form_main_web:
    post:
      summary: Join Us Form Main Web
      operationId: join_us_form_main_web_join_us_form_main_web_post
      parameters:
      - required: true
        schema:
          title: Email
          type: string
        name: email
        in: query
      - required: true
        schema:
          title: Cf Token
          type: string
        name: cf_token
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Join Us Form Main Web
components:
  schemas:
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
