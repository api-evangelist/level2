openapi: 3.2.0
info:
  title: Level2 Hub Controller Leverate Util APIs API
  version: 0.1.0
tags:
- name: Leverate Util APIs
paths:
  /validate_b_token:
    get:
      tags:
      - Leverate Util APIs
      summary: Validate B Token
      operationId: validate_b_token_validate_b_token_get
      parameters:
      - required: true
        schema:
          title: Token
          type: string
        name: token
        in: query
      - required: false
        schema:
          title: Broker Sub
          type: string
        name: broker_sub
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /create_leverate_subdomain_secret:
    post:
      tags:
      - Leverate Util APIs
      summary: Create Leverate Subdomain Secret
      operationId: create_leverate_subdomain_secret_create_leverate_subdomain_secret_post
      parameters:
      - required: true
        schema:
          title: Broker Name
          type: string
        name: broker_name
        in: query
      - required: true
        schema:
          title: Email
          type: string
        name: email
        in: query
      - required: false
        schema:
          title: Website
          type: string
        name: website
        in: query
      - required: false
        schema:
          title: Guid
          type: string
        name: guid
        in: query
      - required: false
        schema:
          title: Logo Url
          type: string
        name: logo_url
        in: query
      - required: false
        schema:
          title: Broker Favicon Url
          type: string
        name: broker_favicon_url
        in: query
      - required: false
        schema:
          title: Broker App Name
          type: string
        name: broker_app_name
        in: query
      - required: false
        schema:
          title: Accent Color
          type: string
        name: accent_color
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /generate_leverate_token:
    post:
      tags:
      - Leverate Util APIs
      summary: Generate Leverate Token
      operationId: generate_leverate_token_generate_leverate_token_post
      parameters:
      - required: false
        schema:
          title: Account Id
          type: string
        name: account_id
        in: query
      - required: false
        schema:
          title: Server Id
          type: integer
        name: server_id
        in: query
      - required: false
        schema:
          title: Broker Sub Domain
          type: string
        name: broker_sub_domain
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
