openapi: 3.2.0
info:
  title: Level2 Like Strategy API
  version: 0.1.0
  description: 'Operations tagged Like Strategy across 2 of this provider''s published API definitions: level2-hub-controller-openapi.json, level2-hub-controller-openapi.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Like Strategy
paths:
  /like_strategy:
    post:
      summary: Like Strategy
      operationId: like_strategy_like_strategy_post
      parameters:
      - required: true
        schema:
          title: User Id
          type: string
        name: user_id
        in: query
      - required: true
        schema:
          title: Strategy Id
          type: integer
        name: strategy_id
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExploreStrategyFavouriteOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Like Strategy
components:
  schemas:
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    UserOut:
      title: UserOut
      required:
      - email
      - first_name
      - last_name
      - unique_key
      - is_active
      type: object
      properties:
        email:
          title: Email
          type: string
        first_name:
          title: First Name
          type: string
        last_name:
          title: Last Name
          type: string
        unique_key:
          title: Unique Key
          type: string
        profile_image:
          title: Profile Image
          type: string
        trading_challenge:
          title: Trading Challenge
          type: string
        description:
          title: Description
          type: string
        is_active:
          title: Is Active
          type: boolean
        user_type:
          title: User Type
          type: string
        meta_data:
          title: Meta Data
          type: string
        created_at:
          title: Created At
          type: string
          format: date-time
    StrategyOut:
      title: StrategyOut
      required:
      - id
      - keygen
      - backtest_type
      type: object
      properties:
        id:
          title: Id
          type: integer
        keygen:
          title: Keygen
          type: string
        strategy_name:
          title: Strategy Name
          type: string
        symbol:
          title: Symbol
          type: string
        is_deleted:
          title: Is Deleted
          type: integer
          default: 0
        timeframe:
          title: Timeframe
          type: string
        strategy_category:
          $ref: '#/components/schemas/StrategyCategoryOut'
        add_ons:
          title: Add Ons
          type: string
        broker_id:
          title: Broker Id
          type: integer
        is_copied:
          title: Is Copied
          type: integer
          default: 0
        is_notification:
          title: Is Notification
          type: integer
          default: 0
        backtest_type:
          title: Backtest Type
          type: string
        strategy_data:
          title: Strategy Data
          type: string
        canvas_data:
          title: Canvas Data
          type: string
        strategy_description:
          title: Strategy Description
          type: string
        created_at:
          title: Created At
          type: string
          format: date-time
    ExploreStrategyFavouriteOut:
      title: ExploreStrategyFavouriteOut
      required:
      - id
      type: object
      properties:
        id:
          title: Id
          type: integer
        user:
          $ref: '#/components/schemas/UserOut'
        explore_strategy:
          $ref: '#/components/schemas/ExploreStrategyOut'
    StrategyCategoryOut:
      title: StrategyCategoryOut
      required:
      - id
      - label
      - description
      - is_valid
      type: object
      properties:
        id:
          title: Id
          type: integer
        label:
          title: Label
          type: string
        description:
          title: Description
          type: string
        is_valid:
          title: Is Valid
          type: string
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ExploreStrategyOut:
      title: ExploreStrategyOut
      required:
      - id
      type: object
      properties:
        id:
          title: Id
          type: integer
        user:
          $ref: '#/components/schemas/UserOut'
