openapi: 3.2.0
info:
  title: Level2 Hub Controller Login User Broker API
  version: 0.1.0
tags:
- name: Login User Broker
paths:
  /login_user_broker:
    post:
      summary: Login User Broker
      operationId: login_user_broker_login_user_broker_post
      parameters:
      - required: true
        schema:
          title: Email
          type: string
        name: email
        in: query
      - required: true
        schema:
          title: Password
          type: string
        name: password
        in: query
      - required: true
        schema:
          title: Broker Domain
          type: string
        name: broker_domain
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Login User Broker
components:
  schemas:
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
