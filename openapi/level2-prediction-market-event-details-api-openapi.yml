openapi: 3.2.0
info:
  title: Level2 Hub Controller Prediction Market Event Details API
  version: 0.1.0
tags:
- name: Prediction Market Event Details
paths:
  /prediction_market_event_details:
    get:
      summary: Prediction Market Event Details
      operationId: prediction_market_event_details_prediction_market_event_details_get
      parameters:
      - required: true
        schema:
          title: User Id
          type: string
        name: user_id
        in: query
      - required: true
        schema:
          title: Event Ticker
          type: string
        name: event_ticker
        in: query
      - required: false
        schema:
          title: Qty
          type: integer
          default: 1
        name: qty
        in: query
      - required: false
        schema:
          title: Broker Id
          type: integer
        name: broker_id
        in: query
      - required: false
        schema:
          title: All Markets
          type: boolean
          default: false
        name: all_markets
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Prediction Market Event Details
components:
  schemas:
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
