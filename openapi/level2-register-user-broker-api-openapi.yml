openapi: 3.2.0
info:
  title: Level2 Hub Controller Register User Broker API
  version: 0.1.0
tags:
- name: Register User Broker
paths:
  /register_user_broker:
    post:
      summary: Register User Broker
      operationId: register_user_broker_register_user_broker_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_register_user_broker_register_user_broker_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Register User Broker
components:
  schemas:
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    Body_register_user_broker_register_user_broker_post:
      title: Body_register_user_broker_register_user_broker_post
      required:
      - token
      - broker
      type: object
      properties:
        token:
          title: Token
          type: string
        broker:
          title: Broker
          type: string
