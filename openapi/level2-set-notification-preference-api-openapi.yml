openapi: 3.2.0
info:
  title: Level2 Hub Controller Set Notification Preference API
  version: 0.1.0
tags:
- name: Set Notification Preference
paths:
  /set_notification_preference:
    post:
      summary: Set Notification Preference
      operationId: set_notification_preference_set_notification_preference_post
      parameters:
      - required: true
        schema:
          title: User Id
          type: string
        name: user_id
        in: query
      - required: false
        schema:
          title: Webhook
          type: string
          default: ''
        name: webhook
        in: query
      - required: false
        schema:
          title: Email Addr
          type: string
          default: ''
        name: email_addr
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Set Notification Preference
components:
  schemas:
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
