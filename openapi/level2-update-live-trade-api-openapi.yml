openapi: 3.2.0
info:
  title: Level2 Hub Controller Update Live Trade API
  version: 0.1.0
tags:
- name: Update Live Trade
paths:
  /update_live_trade:
    post:
      summary: Update Live Trade
      operationId: update_live_trade_update_live_trade_post
      parameters:
      - required: true
        schema:
          title: User Id
          type: string
        name: user_id
        in: query
      - required: true
        schema:
          title: Order Id
          type: integer
        name: order_id
        in: query
      - required: true
        schema:
          title: Close Value
          type: string
        name: close_value
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveDeploymentOrderBookOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Update Live Trade
components:
  schemas:
    StrategyDataLimitedOut:
      title: StrategyDataLimitedOut
      required:
      - strategy_name
      - timeframe
      - symbol
      - id
      - keygen
      type: object
      properties:
        strategy_name:
          title: Strategy Name
          type: string
        timeframe:
          title: Timeframe
          type: string
        symbol:
          title: Symbol
          type: string
        id:
          title: Id
          type: integer
        keygen:
          title: Keygen
          type: string
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    LiveDeploymentOrderBookOut:
      title: LiveDeploymentOrderBookOut
      required:
      - id
      - deployment_id
      type: object
      properties:
        id:
          title: Id
          type: integer
        strategy:
          $ref: '#/components/schemas/StrategyDataLimitedOut'
        deployment_id:
          title: Deployment Id
          type: integer
        stoploss:
          title: Stoploss
          type: string
        target:
          title: Target
          type: string
        decision:
          title: Decision
          type: string
        order_price:
          title: Order Price
          type: string
        filled_at_price:
          title: Filled At Price
          type: number
        result:
          title: Result
          type: number
        actual_result:
          title: Actual Result
          type: number
        quantity:
          title: Quantity
          type: number
        misc_data:
          title: Misc Data
          type: string
        trade_taken_at:
          title: Trade Taken At
          type: string
        trade_closed_at:
          title: Trade Closed At
          type: string
        order_status:
          title: Order Status
          type: string
        close_value:
          title: Close Value
          type: string
        is_valid:
          title: Is Valid
          type: integer
        created_at:
          title: Created At
          type: string
          format: date-time
        symbol:
          title: Symbol
          type: string
        meta_data:
          title: Meta Data
          type: string
