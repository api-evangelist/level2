openapi: 3.2.0
info:
  title: Level2 Hub Controller Update User Preferences API
  version: 0.1.0
tags:
- name: Update User Preferences
paths:
  /update_user_preferences:
    post:
      summary: Update User Preferences
      operationId: update_user_preferences_update_user_preferences_post
      parameters:
      - required: true
        schema:
          title: User Id
          type: string
        name: user_id
        in: query
      - required: true
        schema:
          title: Country
          type: string
        name: country
        in: query
      - required: true
        schema:
          title: Risk
          type: string
        name: risk
        in: query
      - required: true
        schema:
          title: Asset Class
          type: string
        name: asset_class
        in: query
      - required: true
        schema:
          title: Trading Yoe
          type: string
        name: trading_yoe
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Update User Preferences
components:
  schemas:
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
