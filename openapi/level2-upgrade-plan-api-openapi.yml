openapi: 3.2.0
info:
  title: Level2 Hub Controller Upgrade Plan API
  version: 0.1.0
tags:
- name: Upgrade Plan
paths:
  /upgrade_plan:
    post:
      summary: Upgrade Plan
      operationId: upgrade_plan_upgrade_plan_post
      parameters:
      - required: true
        schema:
          title: User Id
          type: string
        name: user_id
        in: query
      - required: true
        schema:
          title: Message
          type: string
        name: message
        in: query
      - required: false
        schema:
          title: Source
          type: string
        name: source
        in: query
      - required: false
        schema:
          title: Coupon
          type: string
        name: coupon
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Upgrade Plan
components:
  schemas:
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
