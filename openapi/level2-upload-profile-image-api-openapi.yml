openapi: 3.2.0
info:
  title: Level2 Hub Controller Upload Profile Image API
  version: 0.1.0
tags:
- name: Upload Profile Image
paths:
  /upload_profile_image:
    post:
      summary: Upload Profile Image
      operationId: upload_profile_image_upload_profile_image_post
      parameters:
      - required: true
        schema:
          title: User Id
          type: string
        name: user_id
        in: query
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_profile_image_upload_profile_image_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Upload Profile Image
components:
  schemas:
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
    Body_upload_profile_image_upload_profile_image_post:
      title: Body_upload_profile_image_upload_profile_image_post
      required:
      - file
      type: object
      properties:
        file:
          title: File
          type: string
          format: binary
