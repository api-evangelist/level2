specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: level2
providerId: level2
created: '2026-05-04'
modified: '2026-09-17'
generated: '2026-09-17'
method: searched
source: >-
  https://learn.trylevel2.com/docs/Broker/API/ (full section walked);
  https://guide.bytemine.io/technical-documentation/api-documentation.md;
  openapi/level2-hub-controller-openapi.json;
  live unauthenticated response headers from https://hub2.trylevel2.com/health
description: >-
  Level2 publishes no numeric rate limits and returns no rate-limit headers. This file records that
  measured absence, plus the one piece of throttling guidance the estate does publish — a prose
  instruction in the legacy Bytemine signal documentation. The earlier version of this file carried
  invented scaffold tiers and header names; those have been removed, because an agent reading
  X-RateLimit-Limit here would be looking for a header this API never sends.
limit_count: 0
limits: []
headers: {}
headers_note: >-
  No RateLimit-*, X-RateLimit-* or Retry-After header is documented anywhere, and none was observed on
  a live unauthenticated response from https://hub2.trylevel2.com/health (HTTP 200). An agent has no
  runtime signal of remaining headroom on this API.
response_codes:
  throttled: null
  note: >-
    No 429 response is declared on any of the 301 operations in the provider's contract. The only
    declared failure code across the whole surface is 422.
published_guidance:
  - scope: legacy Bytemine signal endpoints (app.bytemine.io/api, valhalla.bytemine.workers.dev)
    guidance: >-
      "You can get Candlestick Patterns from our API endpoints. This can be achieved using Long
      Polling. However, make sure to not call our Endpoints without adding atleast a 1 Min Delay."
    interpretation: >-
      A prose minimum inter-request interval of 60 seconds per caller, stated for the candlestick
      signal endpoints. Not a quota, not enforced through any documented header, and stated only for
      the legacy Bytemine surface — whose primary host (app.bytemine.io) no longer resolves.
    source: https://guide.bytemine.io/technical-documentation/api-documentation.md
quota_surfaces:
  note: >-
    Level2's entitlement caps are plan quotas on concurrent RESOURCES, not on request rate — 10
    concurrent strategy deployments and 5 scanner deployments on Pro, 25 and 5 on Elite. Those are
    recorded in plans/level2-plans-pricing.yml and read from
    https://hub2.trylevel2.com/get_main_pricing_plan_details.
